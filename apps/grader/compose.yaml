services:
  grader:
    build: .
    ports:
      - "8788:8788"
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4173}
      PIX2TEXT_URL: http://ocr:8503/ocr
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    depends_on:
      - ocr
    volumes:
      - laya-models:/root/.cache/receptron-laya
  ocr:
    build: ./ocr
    expose:
      - "8503"
    volumes:
      - pix2text-models:/root/.pix2text

volumes:
  laya-models:
  pix2text-models:
